# Production: connects to the company Postgres, no local database.
# Usage: docker compose -f docker-compose.prod.yml up -d --build
services:
  reallocation_bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 80
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env to the company Postgres connection string}
    env_file:
      - .env
    ports:
      - "${HOST_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - ~/.aws:/root/.aws:ro
    logging:
      driver: "awslogs"
      options:
        awslogs-region: "eu-west-2"
        awslogs-group: "reallocation-bot"
        awslogs-stream: "app"
